<template>
    <lightning-card title="Expense Claim">
        <div class="form-container slds-p-around_medium">

            <template lwc:if={isLoading}>
                <div class="loading-container">
                    <lightning-spinner
                        alternative-text="Loading expense claim configuration"
                        size="medium">
                    </lightning-spinner>
                </div>
            </template>

            <template lwc:elseif={loadError}>
                <div
                    class="slds-notify slds-notify_alert slds-alert_error"
                    role="alert"
                >
                    <span class="slds-assistive-text">
                        Error
                    </span>

                    <div>
                        {loadError}
                    </div>
                </div>

                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Retry"
                        variant="brand"
                        onclick={handleRetry}>
                    </lightning-button>
                </div>
            </template>

            <template lwc:elseif={submissionResult}>
                <div class="success-panel">
                    <lightning-icon
                        icon-name="utility:success"
                        alternative-text="Success"
                        size="medium"
                        variant="success">
                    </lightning-icon>

                    <h2
                        class="slds-text-heading_medium slds-m-top_medium"
                    >
                        Expense claim submitted
                    </h2>

                    <p class="slds-m-top_small">
                        Reference:
                        <strong>
                            {successReference}
                        </strong>
                    </p>

                    <p class="slds-m-top_x-small">
                        Status:
                        {submissionResult.status}
                    </p>

                    <p class="slds-m-top_x-small">
                        Total:
                        <lightning-formatted-number
                            value={submissionResult.totalAmount}
                            minimum-fraction-digits="2"
                            maximum-fraction-digits="2">
                        </lightning-formatted-number>
                    </p>

                    <div class="slds-m-top_large">
                        <lightning-button
                            label="Create another claim"
                            variant="brand"
                            onclick={handleNewClaim}>
                        </lightning-button>
                    </div>
                </div>
            </template>

            <template lwc:else>

                <section
                    class="claimant-panel slds-p-around_medium slds-m-bottom_large"
                >
                    <h2 class="slds-text-heading_small">
                        Claimant
                    </h2>

                    <p class="slds-m-top_x-small">
                        <strong>{claimantName}</strong>
                    </p>

                    <p>
                        {claimantEmail}
                    </p>
                </section>

                <lightning-textarea
                    label="Claim description"
                    value={claimDescription}
                    onchange={handleClaimDescriptionChange}>
                </lightning-textarea>

                <div class="section-header slds-m-top_large">
                    <h2 class="slds-text-heading_medium">
                        Expenses
                    </h2>

                    <lightning-button
                        label="Add expense"
                        icon-name="utility:add"
                        onclick={handleAddItem}>
                    </lightning-button>
                </div>

                <template
                    for:each={items}
                    for:item="item"
                >
                    <article
                        key={item.clientId}
                        class="expense-item slds-m-top_medium slds-p-around_medium"
                    >
                        <div class="item-header">
                            <h3 class="slds-text-heading_small">
                                Expense {item.sequence}
                            </h3>

                            <template lwc:if={item.canDelete}>
                                <lightning-button-icon
                                    icon-name="utility:delete"
                                    alternative-text="Delete expense"
                                    title="Delete expense"
                                    data-id={item.clientId}
                                    onclick={handleDeleteItem}>
                                </lightning-button-icon>
                            </template>
                        </div>

                        <div
                            class="slds-grid slds-wrap slds-gutters slds-m-top_small"
                        >
                            <div
                                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"
                            >
                                <lightning-input
                                    type="date"
                                    label="Expense date"
                                    required
                                    value={item.expenseDate}
                                    data-id={item.clientId}
                                    data-field="expenseDate"
                                    onchange={handleItemInputChange}>
                                </lightning-input>
                            </div>

                            <div
                                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"
                            >
                                <lightning-combobox
                                    label="Expense type"
                                    required
                                    value={item.expenseTypeCode}
                                    options={expenseTypeOptions}
                                    data-id={item.clientId}
                                    onchange={handleExpenseTypeChange}>
                                </lightning-combobox>
                            </div>

                            <div
                                class="slds-col slds-size_1-of-1 slds-m-top_small"
                            >
                                <lightning-input
                                    type="text"
                                    label="Description"
                                    required={item.descriptionRequired}
                                    value={item.description}
                                    data-id={item.clientId}
                                    data-field="description"
                                    onchange={handleItemInputChange}>
                                </lightning-input>
                            </div>

                            <div
                                class="slds-col slds-size_1-of-1 slds-m-top_small"
                            >
                                <lightning-input
                                    type="text"
                                    label="Business purpose"
                                    value={item.businessPurpose}
                                    data-id={item.clientId}
                                    data-field="businessPurpose"
                                    onchange={handleItemInputChange}>
                                </lightning-input>
                            </div>

                            <template lwc:if={item.isAmount}>
                                <div
                                    class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small"
                                >
                                    <lightning-input
                                        type="number"
                                        label="Claimed amount"
                                        required
                                        min="0.01"
                                        step="0.01"
                                        value={item.claimedAmount}
                                        data-id={item.clientId}
                                        data-field="claimedAmount"
                                        onchange={handleItemInputChange}>
                                    </lightning-input>
                                </div>
                            </template>

                            <template lwc:if={item.isDistance}>
                                <div
                                    class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small"
                                >
                                    <lightning-input
                                        type="number"
                                        label="Distance"
                                        required
                                        min="0.01"
                                        step="0.01"
                                        value={item.distance}
                                        data-id={item.clientId}
                                        data-field="distance"
                                        onchange={handleItemInputChange}>
                                    </lightning-input>
                                </div>

                                <div
                                    class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small"
                                >
                                    <lightning-input
                                        type="number"
                                        label="Calculated amount"
                                        step="0.01"
                                        value={item.claimedAmount}
                                        disabled>
                                    </lightning-input>
                                </div>

                                <div
                                    class="slds-col slds-size_1-of-1 slds-m-top_small"
                                >
                                    <p class="slds-text-body_small">
                                        Rate:
                                        <lightning-formatted-number
                                            value={item.unitRate}
                                            maximum-fraction-digits="4">
                                        </lightning-formatted-number>

                                        per {item.distanceUnit}
                                    </p>
                                </div>
                            </template>

                            <template lwc:if={item.receiptRequired}>
                                <div
                                    class="slds-col slds-size_1-of-1 slds-m-top_small"
                                >
                                    <lightning-badge
                                        label="Receipt required">
                                    </lightning-badge>
                                </div>
                            </template>
                        </div>

                        <template lwc:if={item.isCalculating}>
                            <div
                                class="slds-m-top_small slds-text-color_weak"
                            >
                                Calculating expense policy…
                            </div>
                        </template>

                        <template lwc:if={item.policyError}>
                            <div
                                class="slds-text-color_error slds-m-top_small"
                                role="alert"
                            >
                                {item.policyError}
                            </div>
                        </template>
                    </article>
                </template>

                <div class="form-actions slds-m-top_large">
                    <lightning-button
                        label="Add expense"
                        icon-name="utility:add"
                        onclick={handleAddItem}>
                    </lightning-button>

                    <lightning-button
                        label="Submit claim"
                        variant="brand"
                        disabled={isSubmitDisabled}
                        onclick={handleSubmit}>
                    </lightning-button>
                </div>

                <template lwc:if={isSubmitting}>
                    <div class="submission-spinner">
                        <lightning-spinner
                            alternative-text="Submitting expense claim"
                            size="medium">
                        </lightning-spinner>
                    </div>
                </template>

            </template>
        </div>
    </lightning-card>
</template>
