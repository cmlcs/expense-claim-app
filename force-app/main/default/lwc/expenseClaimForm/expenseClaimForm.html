<template>
    <!-- Loading -->
    <template lwc:if={isLoading}>
        <div class="slds-p-around_large">
            <lightning-spinner
                alternative-text="Loading expense claim"
                size="medium"
            >
            </lightning-spinner>
        </div>
    </template>

    <!-- Configuration error -->
    <template lwc:elseif={hasLoadError}>
        <lightning-card
            title="Expense claim"
            icon-name="standard:expense"
        >
            <div class="slds-p-around_medium">
                <div
                    class="slds-notify slds-notify_alert slds-alert_error"
                    role="alert"
                >
                    <span>
                        {loadError}
                    </span>
                </div>

                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Retry"
                        variant="brand"
                        onclick={handleRetry}
                    >
                    </lightning-button>
                </div>
            </div>
        </lightning-card>
    </template>

    <!-- Submission result -->
    <template lwc:elseif={hasSubmittedClaim}>
        <lightning-card
            title="Expense claim submitted"
            icon-name="standard:expense"
        >
            <div class="slds-p-around_medium">
                <div
                    class="slds-notify slds-notify_alert slds-theme_success"
                    role="status"
                >
                    Your expense claim has been submitted.
                </div>

                <dl class="slds-list_horizontal slds-wrap slds-m-top_medium">
                    <dt
                        class="slds-item_label slds-truncate"
                        title="Claim"
                    >
                        Claim
                    </dt>
                    <dd class="slds-item_detail">
                        {submittedClaim.claimNumber}
                    </dd>

                    <dt
                        class="slds-item_label slds-truncate"
                        title="Status"
                    >
                        Status
                    </dt>
                    <dd class="slds-item_detail">
                        {submittedClaim.status}
                    </dd>

                    <dt
                        class="slds-item_label slds-truncate"
                        title="Total"
                    >
                        Total
                    </dt>
                    <dd class="slds-item_detail">
                        <lightning-formatted-number
                            value={submittedClaim.totalAmount}
                            format-style="currency"
                            currency-code="EUR"
                        >
                        </lightning-formatted-number>
                    </dd>
                </dl>

                <div class="slds-m-top_large">
                    <lightning-button
                        label="New claim"
                        variant="brand"
                        onclick={handleNewClaim}
                    >
                    </lightning-button>
                </div>
            </div>
        </lightning-card>
    </template>

    <!-- Expense claim form -->
    <template lwc:elseif={hasConfiguration}>
        <lightning-card
            title="Expense claim"
            icon-name="standard:expense"
        >
            <div class="slds-p-around_medium">

                <!-- Claimant -->
                <section class="slds-m-bottom_large">
                    <h2 class="slds-text-heading_small slds-m-bottom_small">
                        Claimant
                    </h2>

                    <div class="slds-grid slds-wrap slds-gutters">
                        <div
                            class="slds-col
                                   slds-size_1-of-1
                                   slds-medium-size_1-of-2"
                        >
                            <span class="slds-text-title">
                                Name
                            </span>

                            <div>
                                {claimantName}
                            </div>
                        </div>

                        <div
                            class="slds-col
                                   slds-size_1-of-1
                                   slds-medium-size_1-of-2"
                        >
                            <span class="slds-text-title">
                                Email
                            </span>

                            <div>
                                {claimantEmail}
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Policy information -->
                <section class="slds-m-bottom_large">
                    <template lwc:if={futureDatesNotAllowed}>
                        <div class="slds-text-body_small">
                            Future expense dates are not allowed.
                        </div>
                    </template>

                    <template lwc:if={maximumExpenseAgeMessage}>
                        <div class="slds-text-body_small">
                            {maximumExpenseAgeMessage}
                        </div>
                    </template>
                </section>

                <!-- Claim description -->
                <lightning-textarea
                    name="claimDescription"
                    label="Claim description"
                    value={claimDescription}
                    onchange={handleClaimDescriptionChange}
                >
                </lightning-textarea>

                <!-- Expense items -->
                <div class="slds-m-top_large">
                    <template
                        for:each={expenseItems}
                        for:item="item"
                    >
                        <section
                            key={item.key}
                            class="expense-item slds-box slds-m-bottom_medium"
                        >
                            <!-- Item heading -->
                            <div
                                class="slds-grid
                                       slds-grid_align-spread
                                       slds-grid_vertical-align-center
                                       slds-m-bottom_medium"
                            >
                                <h3 class="slds-text-heading_small">
                                    Expense
                                </h3>

                                <lightning-button-icon
                                    data-key={item.key}
                                    icon-name="utility:delete"
                                    alternative-text="Delete expense"
                                    title="Delete expense"
                                    onclick={handleDeleteItem}
                                >
                                </lightning-button-icon>
                            </div>

                            <!-- Date and type -->
                            <div class="slds-grid slds-wrap slds-gutters">
                                <div
                                    class="slds-col
                                           slds-size_1-of-1
                                           slds-medium-size_1-of-2"
                                >
                                    <lightning-input
                                        data-key={item.key}
                                        data-field="expenseDate"
                                        type="date"
                                        label="Expense date"
                                        value={item.expenseDate}
                                        onchange={handleItemInputChange}
                                        required
                                    >
                                    </lightning-input>
                                </div>

                                <div
                                    class="slds-col
                                           slds-size_1-of-1
                                           slds-medium-size_1-of-2"
                                >
                                    <lightning-combobox
                                        data-key={item.key}
                                        data-field="expenseTypeCode"
                                        name="expenseType"
                                        label="Expense type"
                                        value={item.expenseTypeCode}
                                        options={expenseTypeOptions}
                                        onchange={handleExpenseTypeChange}
                                        required
                                    >
                                    </lightning-combobox>
                                </div>
                            </div>

                            <!-- Description -->
                            <div class="slds-m-top_medium">
                                <lightning-input
                                    data-key={item.key}
                                    data-field="description"
                                    type="text"
                                    label="Description"
                                    value={item.description}
                                    onchange={handleItemInputChange}
                                    required={item.descriptionRequired}
                                >
                                </lightning-input>

                                <template lwc:if={item.descriptionRequired}>
                                    <div class="slds-m-top_x-small">
                                        <lightning-badge
                                            label="Description required"
                                        >
                                        </lightning-badge>
                                    </div>
                                </template>
                            </div>

                            <!-- Amount -->
                            <template lwc:if={item.isAmount}>
                                <div class="slds-m-top_medium">
                                    <lightning-input
                                        data-key={item.key}
                                        data-field="claimedAmount"
                                        type="number"
                                        label="Amount"
                                        value={item.claimedAmount}
                                        min="0"
                                        max={item.maximumAmount}
                                        step="0.01"
                                        formatter="currency"
                                        onchange={handleItemInputChange}
                                        required
                                    >
                                    </lightning-input>
                                </div>
                            </template>

                            <!-- Distance -->
                            <template lwc:if={item.isDistance}>
                                <div
                                    class="slds-grid
                                           slds-wrap
                                           slds-gutters
                                           slds-m-top_medium"
                                >
                                    <div
                                        class="slds-col
                                               slds-size_1-of-1
                                               slds-medium-size_1-of-2"
                                    >
                                        <lightning-input
                                            data-key={item.key}
                                            data-field="distance"
                                            type="number"
                                            label="Distance"
                                            value={item.distance}
                                            min="0"
                                            step="0.01"
                                            onchange={handleItemInputChange}
                                            required
                                        >
                                        </lightning-input>

                                        <template lwc:if={item.distanceUnit}>
                                            <div
                                                class="slds-text-body_small
                                                       slds-m-top_x-small"
                                            >
                                                Unit: {item.distanceUnit}
                                            </div>
                                        </template>
                                    </div>

                                    <div
                                        class="slds-col
                                               slds-size_1-of-1
                                               slds-medium-size_1-of-2"
                                    >
                                        <lightning-input
                                            type="number"
                                            label="Calculated amount"
                                            value={item.calculatedAmount}
                                            step="0.01"
                                            formatter="currency"
                                            disabled
                                        >
                                        </lightning-input>
                                    </div>
                                </div>
                            </template>

                            <!-- Business purpose -->
                            <div class="slds-m-top_medium">
                                <lightning-input
                                    data-key={item.key}
                                    data-field="businessPurpose"
                                    type="text"
                                    label="Business purpose"
                                    value={item.businessPurpose}
                                    onchange={handleItemInputChange}
                                >
                                </lightning-input>
                            </div>

                            <!-- Policy calculation -->
                            <template lwc:if={item.isPolicyLoading}>
                                <div class="slds-m-top_medium">
                                    <lightning-spinner
                                        alternative-text="Calculating expense"
                                        size="small"
                                    >
                                    </lightning-spinner>
                                </div>
                            </template>

                            <!-- Policy error -->
                            <template lwc:if={item.policyError}>
                                <div
                                    class="slds-notify
                                           slds-notify_alert
                                           slds-alert_error
                                           slds-m-top_medium"
                                    role="alert"
                                >
                                    {item.policyError}
                                </div>
                            </template>

                            <!-- Receipt -->
                            <template lwc:if={item.showReceiptUpload}>
                                <div class="slds-m-top_large">
                                    <div
                                        class="slds-grid
                                               slds-grid_vertical-align-center
                                               slds-m-bottom_x-small"
                                    >
                                        <span class="slds-text-title_bold">
                                            Receipt
                                        </span>

                                        <template lwc:if={item.receiptRequired}>
                                            <span class="slds-m-left_x-small">
                                                <lightning-badge
                                                    label="Required"
                                                >
                                                </lightning-badge>
                                            </span>
                                        </template>
                                    </div>

                                    <lightning-file-upload
                                        data-key={item.key}
                                        label="Upload receipt"
                                        accept={acceptedReceiptFormats}
                                        file-field-name={receiptUploadFieldName}
                                        file-field-value={item.receiptUploadKey}
                                        disabled={item.receiptUploadDisabled}
                                        onuploadfinished={handleReceiptUploadFinished}
                                    >
                                    </lightning-file-upload>

                                    <template lwc:if={item.hasReceipts}>
                                        <div
                                            class="slds-grid
                                                   slds-grid_vertical-align-center
                                                   slds-m-top_x-small"
                                        >
                                            <lightning-icon
                                                icon-name="utility:success"
                                                size="x-small"
                                                alternative-text="Uploaded"
                                            >
                                            </lightning-icon>

                                            <span
                                                class="slds-text-body_small
                                                       slds-m-left_x-small"
                                            >
                                                Uploaded:
                                                {item.receiptSummary}
                                            </span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </section>
                    </template>
                </div>

                <!-- Add expense -->
                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Add expense"
                        icon-name="utility:add"
                        variant="neutral"
                        onclick={handleAddItem}
                    >
                    </lightning-button>
                </div>

                <!-- Total -->
                <div
                    class="slds-grid
                           slds-grid_align-end
                           slds-m-top_large"
                >
                    <div class="slds-text-heading_medium">
                        Total:

                        <lightning-formatted-number
                            data-role="claim-total"
                            value={claimTotal}
                            format-style="currency"
                            currency-code="EUR"
                        >
                        </lightning-formatted-number>
                    </div>
                </div>

                <!-- Submission error -->
                <template lwc:if={submissionError}>
                    <div
                        class="slds-notify
                               slds-notify_alert
                               slds-alert_error
                               slds-m-top_medium"
                        role="alert"
                    >
                        {submissionError}
                    </div>
                </template>

                <!-- Submit -->
                <div
                    class="slds-grid
                           slds-grid_align-end
                           slds-m-top_large"
                >
                    <lightning-button
                        label="Submit claim"
                        variant="brand"
                        onclick={handleSubmit}
                        disabled={submitDisabled}
                    >
                    </lightning-button>
                </div>
            </div>
        </lightning-card>
    </template>
</template>
