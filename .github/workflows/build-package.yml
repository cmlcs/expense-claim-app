name: Build 2GP Beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    name: Build Managed Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Authenticate Dev Hub
        env:
          DEVHUB_SFDX_URL: ${{ secrets.DEVHUB_SFDX_URL }}
        run: |
          printf '%s' "$DEVHUB_SFDX_URL" | sf org login sfdx-url \
            --alias DevHub \
            --set-default-dev-hub \
            --sfdx-url-stdin

      - name: Verify Dev Hub
        run: sf org display --target-org DevHub