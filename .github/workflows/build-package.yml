name: Build 2GP Beta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-package:
    name: Build and Test Managed Package
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Authenticate Dev Hub
        env:
          DEVHUB_SFDX_URL: ${{ secrets.DEVHUB_SFDX_URL }}
        run: |
          printf '%s' "$DEVHUB_SFDX_URL" | sf org login sfdx-url \
            --alias DevHub \
            --set-default-dev-hub \
            --sfdx-url-stdin

      - name: Verify Dev Hub
        run: |
          sf org display \
            --target-org DevHub

      - name: Create package version request
        id: package-create
        shell: bash
        run: |
          set -euo pipefail

          sf package version create \
            --package "Expense Claim" \
            --definition-file config/project-scratch-def.json \
            --installation-key-bypass \
            --code-coverage \
            --branch "$GITHUB_REF_NAME" \
            --tag "$GITHUB_SHA" \
            --target-dev-hub DevHub \
            --json > package-create.json

          REQUEST_ID=$(jq -r '.result.Id // empty' package-create.json)

          if [[ ! "$REQUEST_ID" =~ ^08c ]]; then
            echo "Expected a package creation request ID starting with 08c."
            cat package-create.json
            exit 1
          fi

          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"
          echo "Package creation request: $REQUEST_ID"

      - name: Wait for package version
        id: package-version
        shell: bash
        env:
          REQUEST_ID: ${{ steps.package-create.outputs.request_id }}
        run: |
          set -euo pipefail

          for attempt in {1..60}; do

            sf package version create report \
              --package-create-request-id "$REQUEST_ID" \
              --target-dev-hub DevHub \
              --json > package-report.json

            STATUS=$(jq -r '
              if (.result | type) == "array"
              then .result[0].Status
              else .result.Status
              end
            ' package-report.json)

            echo "Package creation status: $STATUS"

            if [[ "$STATUS" == "Success" ]]; then

              PACKAGE_VERSION_ID=$(jq -r '
                if (.result | type) == "array"
                then .result[0].SubscriberPackageVersionId
                else .result.SubscriberPackageVersionId
                end
              ' package-report.json)

              if [[ ! "$PACKAGE_VERSION_ID" =~ ^04t ]]; then
                echo "Expected Subscriber Package Version ID starting with 04t."
                cat package-report.json
                exit 1
              fi

              echo "package_version_id=$PACKAGE_VERSION_ID" >> "$GITHUB_OUTPUT"
              echo "Created package version: $PACKAGE_VERSION_ID"

              exit 0
            fi

            if [[ "$STATUS" == "Error" ]]; then
              echo "Package version creation failed."
              cat package-report.json
              exit 1
            fi

            echo "Waiting for package version creation. Attempt $attempt of 60."
            sleep 30
          done

          echo "Timed out waiting for package version creation."
          exit 1

      - name: Display package version
        env:
          PACKAGE_VERSION_ID: ${{ steps.package-version.outputs.package_version_id }}
        run: |
          sf package version report \
            --package "$PACKAGE_VERSION_ID" \
            --target-dev-hub DevHub

      - name: Verify package code coverage
        id: package-coverage
        shell: bash
        env:
          PACKAGE_VERSION_ID: ${{ steps.package-version.outputs.package_version_id }}
        run: |
          set -euo pipefail

          sf package version report \
            --package "$PACKAGE_VERSION_ID" \
            --target-dev-hub DevHub \
            --json > package-version-report.json

          PASSED=$(jq -r '
            .result.HasPassedCodeCoverageCheck // false
          ' package-version-report.json)

          COVERAGE=$(jq -r '
            .result.CodeCoverage.apexCodeCoveragePercentage // "unknown"
          ' package-version-report.json)

          echo "Package code coverage: $COVERAGE"
          echo "Passed code coverage check: $PASSED"

          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

          if [[ "$PASSED" != "true" ]]; then
            echo "Package version did not meet the required code coverage."
            cat package-version-report.json
            exit 1
          fi

      - name: Create clean installation test org
        id: install-org
        shell: bash
        run: |
          set -euo pipefail

          sf org create scratch \
            --definition-file config/project-scratch-def.json \
            --alias ExpenseInstallTest \
            --no-namespace \
            --no-track-source \
            --duration-days 1 \
            --target-dev-hub DevHub \
            --wait 15 \
            --json > install-org.json

          INSTALL_ORG_USERNAME=$(jq -r '
            .result.username // empty
          ' install-org.json)

          if [[ -z "$INSTALL_ORG_USERNAME" ]]; then
            echo "Scratch org username was not returned."
            cat install-org.json
            exit 1
          fi

          echo "username=$INSTALL_ORG_USERNAME" >> "$GITHUB_OUTPUT"
          echo "Created installation test org: $INSTALL_ORG_USERNAME"

      - name: Verify installation test org authorization
        shell: bash
        env:
          INSTALL_ORG_USERNAME: ${{ steps.install-org.outputs.username }}
        run: |
          set -euo pipefail

          sf org display \
            --target-org "$INSTALL_ORG_USERNAME" \
            --json > /dev/null

          echo "Installation test org authorization is available."

      - name: Install package
        shell: bash
        env:
          PACKAGE_VERSION_ID: ${{ steps.package-version.outputs.package_version_id }}
          INSTALL_ORG_USERNAME: ${{ steps.install-org.outputs.username }}
        run: |
          set -euo pipefail

          sf package install \
            --package "$PACKAGE_VERSION_ID" \
            --target-org "$INSTALL_ORG_USERNAME" \
            --publish-wait 15 \
            --wait 30 \
            --no-prompt

      - name: Verify installed package
        shell: bash
        env:
          INSTALL_ORG_USERNAME: ${{ steps.install-org.outputs.username }}
        run: |
          set -euo pipefail

          sf package installed list \
            --target-org "$INSTALL_ORG_USERNAME"

      - name: Assign Expense Claim User permission set
        shell: bash
        env:
          INSTALL_ORG_USERNAME: ${{ steps.install-org.outputs.username }}
        run: |
          set -euo pipefail

          sf org assign permset \
            --name Expense_Claim_User \
            --target-org "$INSTALL_ORG_USERNAME"

      - name: Add build summary
        if: success()
        env:
          PACKAGE_VERSION_ID: ${{ steps.package-version.outputs.package_version_id }}
          PACKAGE_COVERAGE: ${{ steps.package-coverage.outputs.coverage }}
          INSTALL_ORG_USERNAME: ${{ steps.install-org.outputs.username }}
        run: |
          {
            echo "## Expense Claim package build"
            echo ""
            echo "Build succeeded."
            echo ""
            echo "- Package version: \`$PACKAGE_VERSION_ID\`"
            echo "- Source branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Package code coverage: \`$PACKAGE_COVERAGE\`"
            echo "- Installation test: passed"
            echo "- Installation org: \`$INSTALL_ORG_USERNAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete installation test org
        if: always()
        continue-on-error: true
        shell: bash
        env:
          INSTALL_ORG_USERNAME: ${{ steps.install-org.outputs.username }}
        run: |
          set +e

          if [[ -z "${INSTALL_ORG_USERNAME:-}" ]]; then
            echo "No installation test org username is available."
            echo "Nothing to delete."
            exit 0
          fi

          echo "Checking authorization for $INSTALL_ORG_USERNAME."

          if sf org display \
            --target-org "$INSTALL_ORG_USERNAME" \
            --json > /dev/null 2>&1; then

            echo "Deleting installation scratch org $INSTALL_ORG_USERNAME."

            sf org delete scratch \
              --target-org "$INSTALL_ORG_USERNAME" \
              --no-prompt

            DELETE_EXIT_CODE=$?

            if [[ "$DELETE_EXIT_CODE" -eq 0 ]]; then
              echo "Scratch org deleted successfully."
            else
              echo "Scratch org deletion returned exit code $DELETE_EXIT_CODE."
              echo "Cleanup is best-effort and will not fail the package build."
            fi

          else

            echo "Authorization for $INSTALL_ORG_USERNAME is unavailable."
            echo "Skipping explicit scratch-org deletion."
            echo "The scratch org was created with a 1-day lifetime and will expire automatically."

          fi

          exit 0